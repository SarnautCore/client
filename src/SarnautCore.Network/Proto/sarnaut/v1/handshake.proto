syntax = "proto3";

package sarnaut.v1;

import "sarnaut/v1/common.proto";

option csharp_namespace = "Sarnaut.Protocol.V1";

message ClientHello {
  ProtocolVersion protocol_version = 1;
  string build_id = 2;
}

message ServerHello {
  ProtocolVersion protocol_version = 1;
  string build_id = 2;
}
