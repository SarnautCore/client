name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SarnautCore.csproj

      # The client commits no generated code, so a hand-edited proto here builds
      # green and mis-parses against a live shard. The lock is byte-identical to
      # server/proto/PROTO_LOCK.sha256 and catches that offline (ADR 0027).
      # TODO(m2): add scripts/sync-proto.ps1 -Check against a second checkout of
      # SarnautCore/server@main once the envelope is on that branch.
      - name: Verify the proto lock
        shell: pwsh
        run: ./scripts/verify-proto-lock.ps1

      - name: Restore
        run: dotnet restore SarnautCore.sln

      - name: Build
        run: dotnet build SarnautCore.sln --configuration Debug --no-restore

      - name: Test networking
        run: dotnet test tests/SarnautCore.Network.Tests/SarnautCore.Network.Tests.csproj --configuration Debug --no-build
