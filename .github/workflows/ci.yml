name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SarnautCore.csproj

      # The client commits no generated code, so a hand-edited proto here builds
      # green and mis-parses against a live shard. The lock is byte-identical to
      # server/proto/PROTO_LOCK.sha256 and catches that offline (ADR 0027).
      - name: Verify the proto lock
        shell: pwsh
        run: ./scripts/verify-proto-lock.ps1

      # The lock above is recomputed from this tree, so a hand-edited proto plus
      # a regenerated lock is still green. Only a byte comparison against the
      # server can catch that, and server/proto is the canonical tree: every wire
      # change is a server pull request first, so main is what this must match.
      - name: Check out the server's canonical proto tree
        uses: actions/checkout@v4
        with:
          repository: SarnautCore/server
          ref: main
          path: .server-proto
          sparse-checkout: proto

      - name: Check the proto tree against the server
        shell: pwsh
        run: ./scripts/sync-proto.ps1 -Check -ServerRepo .server-proto

      # Audit is intentionally non-blocking until the native HUD cutover lands.
      # The fixture suite keeps strict mode honest in the meantime, including the
      # product-content/private-provenance exclusion boundary.
      - name: Test the conversion-retirement gate
        shell: pwsh
        run: ./scripts/test-conversion-retirement-fixtures.ps1

      - name: Report conversion-retirement blockers
        shell: pwsh
        run: ./scripts/test-conversion-retirement.ps1 -Mode Audit

      - name: Restore
        run: dotnet restore SarnautCore.sln

      - name: Build
        run: dotnet build SarnautCore.sln --configuration Debug --no-restore

      # Every test project in the solution, and none of them needs Godot: the
      # headless runtime wants converted assets and libmsquic, so anything left
      # in a Control subclass is untestable here by construction.
      - name: Test
        run: dotnet test SarnautCore.sln --configuration Debug --no-build
