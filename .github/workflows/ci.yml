name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SarnautCore.csproj

      - name: Restore
        run: dotnet restore SarnautCore.sln

      - name: Build
        run: dotnet build SarnautCore.sln --configuration Debug --no-restore

      - name: Test networking
        run: dotnet test tests/SarnautCore.Network.Tests/SarnautCore.Network.Tests.csproj --configuration Debug --no-build
